services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
      POSTGRES_DB: financial_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://financial_user:financial_password@postgres:5432/financial_tracker
      PORT: 5000
      NODE_ENV: development
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-your_plaid_client_id}
      PLAID_SECRET: ${PLAID_SECRET:-your_plaid_secret}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}
      JWT_SECRET: ${JWT_SECRET:-change_this_local_jwt_secret}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-your_plaid_client_id}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
